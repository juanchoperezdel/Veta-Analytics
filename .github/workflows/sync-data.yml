name: Sync Data

on:
  schedule:
    # Cada 6 horas. Estaba en '0 * * * *' (cada hora), pero GitHub hace throttling de
    # los schedules frecuentes: de 24 corridas programadas por dia se ejecutaban ~5, con
    # huecos de hasta 12 h. Espaciado a 6 h el schedule se respeta y quedan 4 corridas parejas (peor
    # caso: 6 h de antiguedad) — de sobra para data de pauta, y baja el consumo de cuota.
    - cron: '0 */6 * * *'
  workflow_dispatch:        # permite trigger manual desde GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    # 10 min quedó corto al sumar Google (10k+ search terms) + 2do cliente + CRM.
    # El sync es idempotente, no pasa nada si tarda; subimos el techo.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run sync script
        run: npx tsx scripts/sync/index.ts
        env:
          DATABASE_URL:               ${{ secrets.DATABASE_URL }}
          META_ACCESS_TOKEN:          ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID:         ${{ secrets.META_AD_ACCOUNT_ID }}
          GOOGLE_ADS_DEV_TOKEN:            ${{ secrets.GOOGLE_ADS_DEV_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID:    ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_ID:          ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_ADS_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID:            ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON:   ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          # CRM GoHighLevel — calidad de leads (por cliente: GHL_TOKEN_<SLUG>)
          GHL_TOKEN_GRIBA:            ${{ secrets.GHL_TOKEN_GRIBA }}
