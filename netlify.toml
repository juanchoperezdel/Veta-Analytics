[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Link público a un anuncio (mail automático de GHL al entrar un lead). Va ANTES del
# fallback de la SPA, si no lo captura index.html.
[[redirects]]
  from   = "/anuncio/*"
  to     = "/.netlify/functions/anuncio?id=:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
